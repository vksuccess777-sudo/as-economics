[pytest]
# Collect ONLY from tests/.
#
# Without this, `python -m pytest` fails on Windows before a single test runs:
#
#   ERROR collecting pages/7_Mock_Test.py
#   AttributeError: st.session_state has no attribute "mock_flow"
#
# pytest's default collection patterns are `test_*.py` and `*_test.py`. On a
# case-insensitive filesystem — which Windows is and Linux is not — the second
# pattern matches `7_Mock_Test.py`, so pytest imports a Streamlit PAGE as a
# test module. The page then runs outside `streamlit run`, finds no session
# state, and errors during collection, which aborts the whole suite.
#
# It is a naming coincidence, not a bug in the page: a screen called
# `7_Mock_Exam.py` would never have shown it. Confining collection to `tests/`
# fixes it for every page, present and future, on every operating system.
testpaths = tests

# Streamlit's AppTest runs pages outside a script-run context and logs a
# warning per widget. Hundreds of them buried the actual failures.
filterwarnings =
    ignore::DeprecationWarning
